name: Publicar na HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostgator
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Enviar por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # A conta FTP é criada com o diretório public_html como raiz (ver PUBLICAR.md).
          server-dir: ./
          exclude: |
            **/.well-known/**
            cgi-bin/**
